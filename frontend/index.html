<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Chess Training</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('chess-theme');
          if (raw) {
            var state = JSON.parse(raw);
            var mode = state.mode || 'auto';
            var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Stockfish (Emscripten factory build). Exposes window.Stockfish; the
         engine itself is instantiated lazily by the Web Worker adapter. -->
    <script src="/stockfish.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
