repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.0
    hooks:
      - id: prettier
        files: \.(ts|tsx|json|md|css|html)$

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npx oxlint
        language: system
        types: [typescript, tsx]

  - repo: local
    hooks:
      - id: tsc
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: vitest
        name: vitest
        entry: npx vitest run
        language: system
        pass_filenames: false
        always_run: true