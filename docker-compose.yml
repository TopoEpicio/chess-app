version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: chess-trainer-db
    environment:
      POSTGRES_DB: chess_trainer
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chess_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_trainer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chess-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: chess-trainer-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chess-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess-trainer-backend
    environment:
      - DATABASE_URL=postgresql://chess_user:${DB_PASSWORD:-chess_password}@db:5432/chess_trainer
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
      - SQL_ECHO=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chess-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess-trainer-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - chess-network

  # pgAdmin (optional, for database management)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: chess-trainer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@chess-trainer.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - chess-network
    profiles:
      - tools

  # Mailhog (optional, for email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: chess-trainer-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - chess-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  backend_data:

networks:
  chess-network:
    driver: bridge